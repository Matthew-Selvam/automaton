name: CI
on: [push, pull_request]
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - name: Test CI gate logic
        run: bash scripts/test-ci-gates.sh
      - name: Run tests
        timeout-minutes: 15
        run: |
          set +e
          timeout 600 pnpm test 2>&1 | tee /tmp/vitest-full.log
          RC=${PIPESTATUS[0]}
          set -e
          # `timeout` reports 124 for any process it kills. The old handler
          # mapped every 124 to success, so a wedged/OOM-killed suite went
          # green.
          #
          # A 124 alone is not enough to distinguish "finished all tests but
          # would not exit" from "wedged partway through". Grepping for a
          # summary line is not sufficient either - vitest streams per-file
          # progress, so a partial run can also contain those lines.
          #
          # So re-run once WITHOUT a timeout, capturing the real exit code.
          # If the suite genuinely completes, this returns 0 and we pass. If it
          # wedges again, the step's own `timeout-minutes` ceiling fails the job
          # for real. The cost is one extra suite run only in the rare case that
          # the first run hit the 600s budget.
          if [ $RC -eq 124 ]; then
            echo "::warning::pnpm test hit the 600s budget; re-running to distinguish a post-test hang from a real wedge"
            pnpm test 2>&1 | tee /tmp/vitest-rerun.log
            RC=${PIPESTATUS[0]}
            if [ $RC -eq 0 ]; then
              echo "::warning::suite completed on re-run without exiting cleanly - treating as pass"
              exit 0
            fi
            echo "::error::suite did not complete cleanly (exit $RC) - treating as failure"
            exit 1
          fi
          exit $RC
      - name: Run security tests
        timeout-minutes: 10
        run: |
          set +e
          timeout 300 pnpm run test:security 2>&1 | tee /tmp/vitest-security.log
          RC=${PIPESTATUS[0]}
          set -e
          if [ $RC -eq 124 ]; then
            echo "::error::security test run timed out - treating as failure"
            exit 1
          fi
          exit $RC

  security-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      # NOTE: `|| true` used to be here, which made this job incapable of
      # failing. It is removed, and the severity floor is deliberately KEPT at
      # `high` - the original intent, which the `|| true` made unenforceable.
      #
      # This currently reports 1 critical + 8 high prod advisories, so the job
      # fails until #389 (which bumps the reachable ones) is merged. That is
      # the honest state: a gate that cannot fail is not a gate.
      #
      # If the advisory set needs to be tolerated while #389 is in review,
      # mark the STEP `continue-on-error: true`. Note that this does not fail
      # the job and is shown as an annotation, not a red X - so do not treat a
      # green check under it as a passing audit.
      - run: pnpm audit --audit-level=high
